[build]
  publish = "."

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/karty-katalogowe/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/cenniki/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
